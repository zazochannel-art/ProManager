# Supabase CLI configuration for LOCAL development (`supabase start`).
# Production settings are configured in the Supabase dashboard — see docs/deployment.md.
project_id = "promanager"

[api]
enabled = true
port = 54321
# The `private` schema (RLS helper functions, role_permissions) is deliberately NOT exposed.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Keep in sync with passwordField in src/features/auth/schemas/auth.ts
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"

[auth.email.template.confirmation]
subject = "Confirmă adresa de e-mail · Confirm your e-mail · Подтвердите e-mail"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Resetează parola · Reset your password · Сброс пароля"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirmă noul e-mail · Confirm your new e-mail · Подтвердите новый e-mail"
content_path = "./supabase/templates/email-change.html"
